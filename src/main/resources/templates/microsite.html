<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${profile.businessName} + ' | My Social Links'">My Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #7c3aed;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, #7c3aed33, transparent);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            margin-bottom: 16px;
            padding: 4px;
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.4);
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg);
        }

        h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 600;
        }

        .niche {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links-container {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text);
            text-align: center;
            font-weight: 400;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
        }

        .link-card:hover {
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 1);
            border-color: var(--primary);
            box-shadow: 0 10px 20px -10px rgba(0,0,0,0.5);
        }

        .footer {
            margin-top: auto;
            padding-top: 60px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Micro-interactions */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .link-card {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }

        .link-card:nth-child(1) { animation-delay: 0.1s; }
        .link-card:nth-child(2) { animation-delay: 0.2s; }
        .link-card:nth-child(3) { animation-delay: 0.3s; }
        .link-card:nth-child(4) { animation-delay: 0.4s; }
        .link-card:nth-child(5) { animation-delay: 0.5s; }
    </style>
</head>
<body>

    <div class="profile-section">
        <div class="avatar">
            <img th:if="${profile.referenceImageUrl != null}" th:src="${profile.referenceImageUrl}" alt="Profile">
            <div th:if="${profile.referenceImageUrl == null}" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:40px; color:white; font-weight:bold;" th:text="${profile.businessName != null and !profile.businessName.isEmpty() ? profile.businessName.substring(0,1) : 'B'}">B</div>
        </div>
        <h1 th:text="${profile.businessName}">Business Name</h1>
        <div class="niche" th:text="${profile.niche}">Niche</div>
    </div>

    <div class="links-container">
        <a th:each="link : ${links}" 
           th:href="${link.url}" 
           class="link-card" 
           th:text="${link.title}"
           th:attr="onclick=|trackClick('${link.id}')|"
           target="_blank">
            Link Title
        </a>
    </div>

    <div class="footer">
        Powered by <a href="https://vaniai.com">VaniAI Studio</a>
    </div>

    <script>
        function trackClick(id) {
            fetch('/api/v1/microsite/click/' + id);
        }
    </script>

</body>
</html>
