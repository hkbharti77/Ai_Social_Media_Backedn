<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Not Found | VaniAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="glass p-12 rounded-[3.5rem] text-center max-w-lg space-y-8 shadow-[0_50px_100px_rgba(0,0,0,0.8)]">
        <div class="text-[8rem] font-black tracking-tighter opacity-10 leading-none">404</div>
        <div class="space-y-4">
            <h1 class="text-4xl font-extrabold tracking-tighter uppercase italic">Brand Signal Lost</h1>
            <p class="text-white/40 font-medium">This microsite doesn't exist or is currently offline. Reach out to the brand owner for the correct link.</p>
        </div>
        <a href="/" class="inline-block px-10 py-5 bg-white text-black font-black uppercase tracking-widest text-xs rounded-2xl hover:scale-105 active:scale-95 transition-all">
            Back to VaniAI
        </a>
    </div>
</body>
</html>
