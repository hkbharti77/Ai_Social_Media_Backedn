app:
  use-s3: ${USE_S3:true}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  scheduling:
    # Trigger times (Cron format: "sec min hour day month weekday")
    morning-draft-cron: "0 35 12 * * ?"      # 6:00 AM IST. Change "0 15 6" for 6:15 AM.
    evening-draft-cron: "0 0 15 * * ?"     # 3:00 PM IST. Change "0 30 15" for 3:30 PM.
    morning-auto-cron: "0 39 12 * * ?"       # 8:00 AM IST check for unapproved drafts.
    evening-auto-cron: "0 0 18 * * ?"      # 6:00 PM IST check for unapproved drafts.

    # Final publication time for auto-scheduled posts (Format: HH:mm)
    morning-publish-time: "12:39"          # Target publish time (e.g., 09:15)
    evening-publish-time: "20:00"          # Target publish time (e.g., 20:30)


