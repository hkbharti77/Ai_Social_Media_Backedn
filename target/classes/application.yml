spring:
  application:
    name: ai-social-media-automation
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_social_media
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50   # Fallback batch-fetch for any remaining lazy collections

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: ${SMTP_SERVER:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION:ap-south-1}
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash-lite
    imagen:
      image-model: gemini-3.1-flash-image-preview
      api-url: https://generativelanguage.googleapis.com/v1beta
    veo:
      model: veo-3.1-fast-generate-preview  # Changed from Standard to Fast (74% cost reduction)
      credit-cost: 20.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

mail:
  sender: ${SENDER_EMAIL:ewardmacllum@gmail.com}
  admin: ${ADMIN_EMAIL:himanshukumar02001@gmail.com}


app:
  security:
    owner-email: ${OWNER_EMAIL:hkbharti77@gmail.com}
  use-s3: ${USE_S3:true}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  ffmpeg:
    path: ${FFMPEG_PATH:D:/ffmpeg/ffmpeg-8.1-essentials_build/bin/ffmpeg.exe}
  instagram:
    reel:
      skip-transcode: ${INSTAGRAM_REEL_SKIP_TRANSCODE:false}
  scheduling:
    # Trigger times (Cron format: "sec min hour day month weekday") — zone: Asia/Kolkata (IST)
    morning-draft-cron: "0 0 6 * * ?"       # 6:00 AM IST — Generate morning drafts
    evening-draft-cron: "0 0 15 * * ?"      # 3:00 PM IST — Generate evening drafts
    morning-auto-cron: "0 0 8 * * ?"        # 8:00 AM IST — Auto-schedule if user hasn't approved (2hr window)
    evening-auto-cron: "0 0 18 * * ?"       # 6:00 PM IST — Auto-schedule if user hasn't approved (3hr window)

    # Final publication time for auto-scheduled posts (Format: HH:mm IST)
    morning-publish-time: "09:00"           # 9:00 AM IST — Morning post goes live
    evening-publish-time: "20:00"           # 8:00 PM IST — Evening post goes live


fb:
  app:
    id: ${FB_APP_ID}
    secret: ${FB_APP_SECRET}
    access-token: ${FB_ACCESS_TOKEN}
  redirect:
    uri: ${FB_REDIRECT_URI:http://localhost:8080/api/v1/social/callback/facebook}

linkedin:
  client:
    id: ${LINKEDIN_CLIENT_ID}
    secret: ${LINKEDIN_CLIENT_SECRET}
  redirect:
    uri: ${LINKEDIN_REDIRECT_URI:http://localhost:8080/api/v1/social/callback/linkedin}

encryption:
  secret: ${ENCRYPTION_SECRET} # Must be 16 chars for AES

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET}

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 # 15 minutes
  refresh-token:
    expiration: 604800000 # 7 days

logging:
  file:
    name: logs/ai-platform.log
  level:
    org.springframework.security: DEBUG
    com.aiplatform: DEBUG

x:
  client:
    id: ${X_CLIENT_ID}
    secret: ${X_CLIENT_SECRET}
  redirect:
    uri: ${X_REDIRECT_URI:http://localhost:8080/api/v1/social/callback/x}
